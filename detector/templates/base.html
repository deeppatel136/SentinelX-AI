{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>

        SentinelX AI

    </title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            font-family:'Poppins',sans-serif;
        }

        body{

            background:#0f172a;

            color:white;

            padding-top:85px;

        }

        /* ================= NAVBAR ================= */

        .navbar{

            background:#020617;

            box-shadow:0 0 15px rgba(0,255,255,.15);

        }

        .navbar-brand{

            font-size:28px;

            font-weight:700;

            color:#00e5ff !important;

        }

        .navbar-brand span{

            color:#ffffff;

        }

        .nav-link{

            color:#d1d5db !important;

            font-weight:500;

            margin-right:10px;

            transition:.3s;

        }

        .nav-link:hover{

            color:#00e5ff !important;

        }

        .btn-login{

            background:#00bcd4;

            color:white;

            border:none;

            font-weight:600;

        }

        .btn-login:hover{

            background:#0097a7;

        }

        /* ================= MAIN ================= */

        .main-content{

            min-height:85vh;

        }

        /* ================= CARD ================= */

        .card{

            background:#1e293b;

            border:none;

            border-radius:15px;

            color:white;

            box-shadow:0 0 20px rgba(0,255,255,.08);

        }

        /* ================= BUTTON ================= */

        .btn-primary{

            background:#00bcd4;

            border:none;

        }

        .btn-primary:hover{

            background:#0097a7;

        }

        /* ================= FOOTER ================= */

        footer{

            background:#020617;

            padding:18px;

            text-align:center;

            margin-top:60px;

            color:#9ca3af;

            font-size:15px;

            border-top:1px solid #1f2937;

        }

    </style>

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">

    <div class="container">

        <a class="navbar-brand"
           href="{% url 'dashboard' %}">

            <i class="fa-solid fa-shield-halved"></i>

            Sentinel<span>X AI</span>

        </a>

        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav ms-auto align-items-center">

                <!-- <li class="nav-item">

                    <a class="nav-link"
                       href="{% url 'dashboard' %}">

                        <i class="fa-solid fa-house"></i>

                        Dashboard

                    </a>

                </li> -->

                <li class="nav-item">

                    <a class="nav-link"
                       href="{% url 'scan' %}">

                        URL Scan

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="{% url 'email_scan' %}">

                        Email Scan

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="{% url 'image_scan' %}">

                        Image Scan

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="{% url 'file_scan' %}">

                        File Scan

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                    href="{% url 'qr_scan' %}">

                        <!-- <i class="fa-solid fa-qrcode"></i> -->

                        QR Scan

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="{% url 'history' %}">

                        History

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"

                    href="{% url 'chatbot' %}">

                    <!-- <i class="fa-solid fa-robot"></i> -->

                    AI Chatbot

                    </a>

                </li>

                <li class="nav-item ms-2">

                    <a class="btn btn-login"
                       href="{% url 'logout' %}">

                        <i class="fa-solid fa-right-from-bracket"></i>

                        Logout

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- ================= CONTENT ================= -->

<div class="container main-content">

    {% block content %}

    {% endblock %}

</div>

<!-- ================= FOOTER ================= -->

<footer>

    © 2026 SentinelX AI |
    AI-Powered Multi-Channel Scam & Phishing Detection Platform

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
