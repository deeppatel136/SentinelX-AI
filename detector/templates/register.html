<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>

Register |  SentinelX AI


</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(
135deg,
#020617,
#07152d,
#0b1d3a,
#08111f
);

font-family:'Segoe UI',sans-serif;

overflow:hidden;

position:relative;

}

body::before{

content:"";

position:absolute;

width:100%;
height:100%;

background:

radial-gradient(circle at top left,
rgba(0,255,255,.08),
transparent 45%),

radial-gradient(circle at bottom right,
rgba(0,150,255,.08),
transparent 45%);

animation:bgMove 12s linear infinite;

}

@keyframes bgMove{

0%{
transform:translate(0,0);
}

50%{
transform:translate(-20px,-20px);
}

100%{
transform:translate(0,0);
}

}

.register-card{

position:relative;

z-index:10;

width:100%;
max-width:500px;

background:#081425;

border:1px solid rgba(0,255,255,.18);

border-radius:22px;

overflow:hidden;

box-shadow:
0 0 25px rgba(0,255,255,.12),
0 0 80px rgba(0,140,255,.12);

}

.card-header{

background:
linear-gradient(
90deg,
#00d4ff,
#0077ff
);

padding:28px;

text-align:center;

color:white;

}

.logo{

width:78px;
height:78px;

margin:auto;

border-radius:50%;

display:flex;

justify-content:center;

align-items:center;

background:white;

color:#0077ff;

font-size:34px;

margin-bottom:18px;

box-shadow:0 0 20px rgba(255,255,255,.4);

}

.card-header h2{

font-weight:700;

margin-bottom:6px;

}

.card-header p{

margin:0;

opacity:.9;

font-size:15px;

}

.card-body{

padding:35px;

background:#081425;

}

.form-control{

height:56px;

background:#0c1d34;

border:1px solid #173b64;

color:white;

border-radius:12px;

}

.form-control:focus{

background:#0c1d34;

color:white;

border-color:#00d4ff;

box-shadow:0 0 15px rgba(0,212,255,.35);

}

.form-control::placeholder{

color:#8eb7da;

}

.input-group-text{

background:#0c1d34;

border:1px solid #173b64;

color:#00d4ff;

}

.btn-register{

height:56px;

border:none;

border-radius:12px;

font-weight:700;

font-size:18px;

color:white;

background:linear-gradient(
90deg,
#00d4ff,
#0077ff
);

transition:.35s;

}

.btn-register:hover{

transform:translateY(-3px);

box-shadow:0 0 18px rgba(0,212,255,.45);

}

.login-link{

color:#a9d8ff;

text-decoration:none;

font-weight:600;

}

.login-link:hover{

color:#00d4ff;

}

.footer-text{

margin-top:30px;

text-align:center;

font-size:13px;

color:#8eb3d6;

}

.footer-text i{

color:#00d4ff;

}

</style>

</head>

<body>

<div class="register-card">

<div class="card-header">

<div class="logo">

<i class="bi bi-shield-lock-fill"></i>

</div>

<h2>

Create Account

</h2>

<p>

Join  SentinelX AI Security Platform

</p>

</div>

<div class="card-body">

    <form method="POST">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">

Username

</label>

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-person-fill"></i>

</span>

<input
type="text"
name="username"
class="form-control"
placeholder="Enter Username"
required>

</div>

</div>

<div class="mb-3">

<label class="form-label">

Email Address

</label>

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-envelope-fill"></i>

</span>

<input
type="email"
name="email"
class="form-control"
placeholder="Enter Email Address"
required>

</div>

</div>

<div class="mb-4">

<label class="form-label">

Password

</label>

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-lock-fill"></i>

</span>

<input
type="password"
name="password"
class="form-control"
placeholder="Create Password"
required>

</div>

</div>

<button
type="submit"
class="btn btn-register w-100">

<i class="bi bi-person-plus-fill"></i>

Create Account

</button>

</form>

<div class="text-center mt-4">

<a
href="{% url 'login' %}"
class="login-link">

<i class="bi bi-box-arrow-in-right"></i>

Already have an account? Login

</a>

</div>

<div class="footer-text">

<hr class="border-secondary">

<i class="bi bi-shield-lock-fill"></i>

Powered by

<strong>

SentinelX AI

</strong>

<br>

AI-Powered Multi-Channel Scam Detection Platform

</div>

</div>

</div>

</body>

</html>
